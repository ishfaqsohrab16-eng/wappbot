services:
  wappbot:
    build: .
    restart: unless-stopped
    environment:
      # Wiring inside this stack
      PUBLIC_URL: http://wappbot:3000
      EVOLUTION_BASE_URL: http://wb-evolution:8080
      STT_PROVIDER: whisper-asr
      STT_BASE_URL: http://wb-whisper:9000
      DATA_DIR: /app/data
      
      # App Variables
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      ADMIN_NUMBERS: ${ADMIN_NUMBERS}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE}
      UNAUTHORIZED_REPLY: ${UNAUTHORIZED_REPLY}
      ALLOW_GROUPS: ${ALLOW_GROUPS:-false}
      
      # Evolution API Variables
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      
      # MySQL Database Variables
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-15000}
      DB_MAX_ROWS: ${DB_MAX_ROWS:-50}
      
      # LLM Variables (local Ollama only by default)
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-local}
      LLM_FALLBACK: ${LLM_FALLBACK:-none}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_LLM_MODEL: ${GOOGLE_LLM_MODEL:-}
      GOOGLE_LLM_BASE_URL: ${GOOGLE_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GOOGLE_COOLDOWN_MS: ${GOOGLE_COOLDOWN_MS:-900000}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://wp_man_llm:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      LLM_AUTO_PULL: ${LLM_AUTO_PULL:-true}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-4096}
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:--1}
      LLM_THINK: ${LLM_THINK:-false}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-800}
      LLM_BOT_MAX_TOKENS: ${LLM_BOT_MAX_TOKENS:-400}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-300000}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-2}
      LLM_MAX_QUEUE: ${LLM_MAX_QUEUE:-10}
      LLM_RATE_LIMIT_PER_MIN: ${LLM_RATE_LIMIT_PER_MIN:-10}
      LLM_HISTORY_MESSAGES: ${LLM_HISTORY_MESSAGES:-30}
      LLM_HISTORY_DAYS: ${LLM_HISTORY_DAYS:-30}
      LLM_MAX_USER_CHARS: ${LLM_MAX_USER_CHARS:-2000}
      LLM_MAX_AGENT_STEPS: ${LLM_MAX_AGENT_STEPS:-4}

      # Query engine (fixed read-only handlers; the LLM never writes SQL)
      ENGINE_LLM_FALLBACK: ${ENGINE_LLM_FALLBACK:-true}
      LEARN_MIN_CONFIDENCE: ${LEARN_MIN_CONFIDENCE:-0.6}
      LEARN_ACTIVE_CONFIDENCE: ${LEARN_ACTIVE_CONFIDENCE:-0.8}
      RESULT_CACHE_MS: ${RESULT_CACHE_MS:-60000}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-5000}
      AUTO_EXCEL: ${AUTO_EXCEL:-true}
      AUTO_CHART: ${AUTO_CHART:-true}

      # Voice replies (text-to-speech runs in this stack)
      TTS_BASE_URL: ${TTS_BASE_URL:-http://wb-tts:8880}
      TTS_VOICE: ${TTS_VOICE:-af_heart}
      TTS_MAX_CHARS: ${TTS_MAX_CHARS:-350}
      BOT_VOICE_REPLIES: ${BOT_VOICE_REPLIES:-true}

      # Database tuning
      DB_ALLOWED_TABLES: ${DB_ALLOWED_TABLES:-}
      DB_BLOCKED_COLUMNS_REGEX: ${DB_BLOCKED_COLUMNS_REGEX:-pass|pwd|token|secret|salt|hash|otp|api_?key|remember}
      DB_SCHEMA_NOTES: ${DB_SCHEMA_NOTES:-}

      # Speech-to-text
      STT_TIMEOUT_MS: ${STT_TIMEOUT_MS:-120000}
      STT_MAX_AUDIO_SECONDS: ${STT_MAX_AUDIO_SECONDS:-180}

      # Bot behaviour
      BOT_NAME: ${BOT_NAME:-DigiBizz Assistant}
      BOT_CONTEXT_NOTE: ${BOT_CONTEXT_NOTE:-You answer questions about an LMS (learning management system) database.}
      BOT_ACK_AFTER_MS: ${BOT_ACK_AFTER_MS:-10000}
      BOT_WELCOME_ON_ADD: ${BOT_WELCOME_ON_ADD:-true}
      BOT_ECHO_TRANSCRIPT: ${BOT_ECHO_TRANSCRIPT:-true}
      BOT_SHOW_THINKING: ${BOT_SHOW_THINKING:-true}
      EVOLUTION_AUTO_SET_WEBHOOK: ${EVOLUTION_AUTO_SET_WEBHOOK:-true}

      # Whisper Variables
      WHISPER_MODEL: ${WHISPER_MODEL:-small}

    volumes:
      - wappbot-data:/app/data
    expose:
      - "3000"
    depends_on:
      - wb-evolution
      - wb-whisper
    networks:
      - default
      - easypanel

  wb-whisper:
    image: onerahmet/openai-whisper-asr-webservice:${WHISPER_IMAGE_TAG:-v1.10.0}
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-small}
    cpus: ${WHISPER_CPUS:-4}
    volumes:
      - whisper-cache:/root/.cache
    expose:
      - "9000"

  # Text-to-speech for voice replies (Kokoro, OpenAI-compatible API, CPU)
  wb-tts:
    image: ${TTS_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:latest}
    restart: unless-stopped
    cpus: ${TTS_CPUS:-2}
    expose:
      - "8880"

  wb-evolution:
    image: evoapicloud/evolution-api:${EVOLUTION_IMAGE_TAG:-v2.3.7}
    restart: unless-stopped
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://wb-evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      LANGUAGE: en
      LOG_LEVEL: ERROR,WARN,INFO
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: ${BOT_NAME:-WappBot}
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
      WEBHOOK_GLOBAL_ENABLED: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@wb-evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: wappbot
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://wb-evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution-instances:/evolution/instances
    expose:
      - "8080"
    depends_on:
      wb-evolution-db:
        condition: service_healthy
      wb-evolution-redis:
        condition: service_healthy

  wb-evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  wb-evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  wappbot-data:
  whisper-cache:
  evolution-instances:
  evolution-db:
  evolution-redis:

networks:
  default:
  easypanel:
    external: true
